# Cấu hình CHỈ để chạy thử trên máy (npm run dev): không cần đăng nhập Cloudflare,
# không có Workers AI, bỏ qua kiểm tra Cloudflare Access. Bản thật dùng wrangler.toml.
name = "mylife"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "mylife"
database_id = "16263ebc-5d31-4667-a299-5136888037fb"
migrations_dir = "migrations"

[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[vars]
OWNER_EMAIL = "son.phanhong@gmail.com"
# Thử lần lượt; mô hình nào Google báo không có (404) thì tự chuyển sang mô hình sau
GEMINI_MODEL = "gemini-3.1-flash-lite,gemini-3.5-flash-lite,gemini-2.5-flash-lite"
WORKERS_AI_MODEL = "@cf/google/gemma-3-12b-it"
GEMINI_DAILY_REQUESTS = "1000"
WORKERS_AI_DAILY_NEURONS = "10000"
QUOTA_STOP_RATIO = "0.95"
# Vòng 1: mỗi key dùng tới 50% rồi chuyển key kế tiếp; vòng 2 dùng tiếp tới 95%
QUOTA_ROUND_RATIO = "0.5"
# Vùng của tài nguyên Azure Translator (đổi theo vùng anh tạo)
AZURE_TRANSLATOR_REGION = "southeastasia"
DEV_SKIP_AUTH = "1"
# Chỉ local: giả lập bản dịch để xem giao diện (không gọi dịch vụ thật)
DEV_FAKE_TRANSLATE = "1"
