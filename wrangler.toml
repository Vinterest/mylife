name = "mylife"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
# Giữ các biến anh thêm trên trang Cloudflare khi deploy từ GitHub (không bị ghi đè)
keep_vars = true
# Chỉ chạy qua mylife.gm-chess.com (có Cloudflare Access). Tắt địa chỉ *.workers.dev để không ai đi vòng qua Access.
workers_dev = false
preview_urls = false

# Gắn vào subdomain khi deploy (cần DNS gm-chess.com nằm trên Cloudflare)
routes = [{ pattern = "mylife.gm-chess.com", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "mylife"
database_id = "16263ebc-5d31-4667-a299-5136888037fb"
migrations_dir = "migrations"

[ai]
binding = "AI"

# Nhật ký lỗi xem được trong Cloudflare → Workers → mylife → Observability / Logs
[observability]
enabled = true

[triggers]
# Gói miễn phí giới hạn 5 cron cho CẢ tài khoản và ~10 ms CPU mỗi lượt,
# nên chỉ dùng 1 cron mỗi 5 phút: mỗi nhịp crawl 1 nguồn đến hạn
# (RSS mỗi 6 giờ, arXiv sau 06:00 giờ VN), chọn Đáng đọc sau 06:30, lấy toàn văn,
# và dịch tiếp bài anh đã bấm "Dịch bài này".
crons = ["*/5 * * * *"]

[vars]
OWNER_EMAIL = "son.phanhong@gmail.com"
GEMINI_MODEL = "gemini-2.5-flash-lite"
WORKERS_AI_MODEL = "@cf/google/gemma-3-12b-it"
# Hạn mức miễn phí (chỉnh theo trang của nhà cung cấp khi thay đổi)
GEMINI_DAILY_REQUESTS = "1000"
WORKERS_AI_DAILY_NEURONS = "10000"
QUOTA_STOP_RATIO = "0.95"
# Vòng 1: mỗi key dùng tới 50% rồi chuyển key kế tiếp; vòng 2 dùng tiếp tới 95%
QUOTA_ROUND_RATIO = "0.5"
# Vùng của tài nguyên Azure Translator (đổi theo vùng anh tạo)
AZURE_TRANSLATOR_REGION = "southeastasia"
# Đặt "1" khi chạy local để bỏ qua kiểm tra đăng nhập Access
DEV_SKIP_AUTH = "0"

# Cho phép import các file .sql dạng chữ (Worker tự tạo bảng ở lần chạy đầu)
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true
